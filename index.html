<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🇨🇳 중국지도 SENSE 32</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;background:#f4f7fb;color:#172033;touch-action:manipulation}header{padding:10px 14px;background:#fff;border-bottom:1px solid #e5e8ef;display:flex;gap:8px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}h1{font-size:19px;margin:0}.stats{display:flex;gap:6px;flex-wrap:wrap}.pill{background:#eef2ff;border-radius:999px;padding:6px 9px;font-weight:800;font-size:12px}.wrap{max-width:1100px;margin:auto;padding:10px}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}.controls button,.panel button{border:0;border-radius:11px;padding:9px 12px;background:#fff;box-shadow:0 1px 5px #0001;font-weight:800}.controls button.active{background:#172033;color:#fff}.panel{background:#fff;border-radius:14px;padding:10px;margin-bottom:9px;box-shadow:0 2px 10px #0001}.panel input{padding:9px;border:1px solid #d6dce5;border-radius:9px;width:150px}.panel .primary{background:#172033;color:#fff}.hidden{display:none!important}.question{background:#fff;border-radius:15px;padding:12px;margin-bottom:9px;box-shadow:0 2px 10px #0001}.qsmall{font-size:12px;color:#657087}.target{font-size:24px;font-weight:900;margin-top:3px}.hint{font-size:12px;color:#68748a;margin-top:2px}.mapbox{background:#dfeaf2;border-radius:17px;overflow:hidden;box-shadow:0 2px 12px #0001;position:relative}.mapbox svg{display:block;width:100%;height:min(66vh,650px);background:#eaf3f7}.province{fill:#fff;stroke:#778899;stroke-width:.6;cursor:pointer}.province.correct{fill:#86efac;stroke:#15803d;stroke-width:1.2}.province.wrong{fill:#fecaca;stroke:#dc2626;stroke-width:1.1}.citydot{fill:#1d4ed8;stroke:#fff;stroke-width:1.5;cursor:pointer}.citydot.correct{fill:#16a34a}.citydot.wrong{fill:#dc2626}.label{font-size:9px;fill:#344054;pointer-events:none;text-anchor:middle;font-weight:700}.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 14px;border-radius:999px;font-weight:900;display:none;z-index:3;white-space:nowrap}.toast.show{display:block}.start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0003;z-index:2}.start button{font-size:19px;padding:14px 23px;border:0;border-radius:15px;background:#fff;font-weight:900;box-shadow:0 5px 20px #0003}.result{text-align:center;font-weight:900;padding:9px}.rank{max-height:280px;overflow:auto}.rank table{width:100%;border-collapse:collapse;font-size:13px}.rank td{padding:5px;border-bottom:1px solid #eee}.rank td:first-child{text-align:center;font-weight:900;width:42px}.status{font-size:12px;color:#64748b}.note{font-size:11px;color:#697386;line-height:1.45;margin-top:7px}@media(max-width:600px){h1{font-size:16px}.target{font-size:21px}.mapbox svg{height:59vh}.pill{padding:5px 7px}}
</style></head><body>
<header><h1>🇨🇳 중국지도 SENSE</h1><div class="stats"><span class="pill">점수 <b id="score">0</b></span><span class="pill">문제 <b id="round">0/10</b></span><span class="pill">⏱ <b id="time">60</b></span></div></header>
<main class="wrap">
<section class="panel" id="lobby"><b>👥 32명 수업 모드</b><div style="margin-top:7px;display:flex;gap:6px;flex-wrap:wrap"><input id="nickname" maxlength="10" placeholder="이름/번호"><button class="primary" id="hostBtn">교사 방 만들기</button><input id="roomCode" maxlength="8" placeholder="방 코드"><button id="joinBtn">학생 참가</button></div><div class="status" id="connStatus">혼자 테스트하려면 아래 게임 시작을 눌러도 됩니다.</div></section>
<div class="controls"><button class="active" data-mode="province">성·자치구</button><button data-mode="city">주요 도시</button><button id="restart">↻ 다시 시작</button></div>
<section class="question"><div class="qsmall" id="qtype">지도에서 다음 성·자치구를 찾아 터치하세요</div><div class="target" id="target">게임 시작을 눌러 주세요</div><div class="hint" id="hint">인터넷 연결 후 지도 데이터가 자동으로 불러와집니다.</div></section>
<div class="mapbox"><div class="toast" id="toast"></div><div class="start" id="start"><button id="startBtn">게임 시작</button></div><svg id="map" viewBox="0 0 1000 700"></svg></div>
<div class="result" id="result">정답 +100점 · 오답 -20점</div>
<section class="panel hidden" id="ranking"><b>🏆 현재 순위</b><div class="rank"><table><tbody id="rankBody"></tbody></table></div></section>
<div class="note">교사 방을 만들면 방 코드가 표시됩니다. 학생들은 같은 코드를 입력해 참가합니다. 게임 자체는 각 태블릿에서 독립적으로 진행되며 점수만 공유합니다.</div>
</main>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const provinceNames=['北京','天津','河北','山西','内蒙古','辽宁','吉林','黑龙江','上海','江苏','浙江','安徽','福建','江西','山东','河南','湖北','湖南','广东','广西','海南','重庆','四川','贵州','云南','西藏','陕西','甘肃','青海','宁夏','新疆'];
const cities=[['北京','베이징',39.9042,116.4074],['上海','상하이',31.2304,121.4737],['西安','시안',34.3416,108.9398],['成都','청두',30.5728,104.0668],['重庆','충칭',29.563,106.5516],['广州','광저우',23.1291,113.2644],['深圳','선전',22.5431,114.0579],['桂林','구이린',25.2742,110.29],['昆明','쿤밍',25.0389,102.7183],['青岛','칭다오',36.0671,120.3826],['哈尔滨','하얼빈',45.8038,126.5349],['乌鲁木齐','우루무치',43.8256,87.6168],['拉萨','라싸',29.652,91.1721],['丽江','리장',26.8721,100.2299],['厦门','샤먼',24.4798,118.0894],['大连','다롄',38.914,121.6147],['南京','난징',32.0603,118.7969],['杭州','항저우',30.2741,120.1551],['武汉','우한',30.5928,114.3055],['长沙','창사',28.2282,112.9388],['郑州','정저우',34.7466,113.6254],['济南','지난',36.6512,117.1201],['沈阳','선양',41.8057,123.4315],['长春','창춘',43.8171,125.3235],['太原','타이위안',37.8706,112.5489],['兰州','란저우',36.0611,103.8343],['西宁','시닝',36.6171,101.7782],['银川','인촨',38.4872,106.2309],['呼和浩特','후허하오特',40.8426,111.7492],['南宁','난닝',22.817,108.3665],['福州','푸저우',26.0745,119.2965],['南昌','난창',28.682,115.8579],['贵阳','구이양',26.647,106.6302],['海口','하이커우',20.044,110.1983],['石家庄','스자좡',38.0428,114.5149]];
let mode='province',features=[],score=0,round=0,target=null,playing=false,timer=60,timerId=null,player='',peer=null,isHost=false,connections=[],scores={};
const svg=document.getElementById('map'),NS='http://www.w3.org/2000/svg';
function proj(lon,lat){return [(lon-73)/62*930+25,(54-lat)/39*640+20]}
function polyPath(a){return a.map((p,i)=>{let [x,y]=proj(p[0],p[1]);return(i?'L':'M')+x.toFixed(1)+','+y.toFixed(1)}).join(' ')+'Z'}
function pathFor(g){if(g.type==='Polygon')return polyPath(g.coordinates[0]);if(g.type==='MultiPolygon')return g.coordinates.map(p=>polyPath(p[0])).join(' ');return ''}
function norm(s){return String(s||'').replace(/(省|市|自治区|壮族自治区|回族自治区|维吾尔自治区)$/,'')}
function render(){svg.innerHTML='';features.forEach(f=>{let p=document.createElementNS(NS,'path');p.setAttribute('d',pathFor(f.geometry));p.classList.add('province');p.dataset.name=f.properties.name||f.properties.NAME||'';p.onclick=()=>answer(norm(p.dataset.name)===norm(target),p);svg.appendChild(p)});if(mode==='city')cities.forEach(c=>{let [n,ko,lat,lon]=c,[x,y]=proj(lon,lat),g=document.createElementNS(NS,'g'),d=document.createElementNS(NS,'circle'),t=document.createElementNS(NS,'text');d.setAttribute('cx',x);d.setAttribute('cy',y);d.setAttribute('r',5);d.classList.add('citydot');d.onclick=()=>answer(n===target,d);g.appendChild(d);t.setAttribute('x',x);t.setAttribute('y',y-8);t.classList.add('label');t.textContent=n;g.appendChild(t);svg.appendChild(g)})}
function pickTarget(){if(round>=10){finish();return}round++;document.getElementById('round').textContent=round+'/10';if(mode==='province'){let f=features[Math.floor(Math.random()*features.length)];target=norm(f.properties.name||f.properties.NAME);document.getElementById('target').textContent=target+'을(를) 찾아보세요';}else{let c=cities[Math.floor(Math.random()*cities.length)];target=c[0];document.getElementById('target').textContent=c[0]+'（'+c[1]+'）을(를) 찾아보세요'}clearMarks()}
function clearMarks(){svg.querySelectorAll('.correct,.wrong').forEach(e=>e.classList.remove('correct','wrong'))}
function answer(ok,el){if(!playing)return;el.classList.add(ok?'correct':'wrong');beep(ok);score+=ok?100:-20;document.getElementById('score').textContent=score;showToast(ok?'⭕ 정답! +100':'❌ 오답! -20');syncScore();setTimeout(()=>{if(playing)pickTarget()},650)}
function showToast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),600)}
function beep(ok){try{let C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?660:180;o.type=ok?'sine':'sawtooth';g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.16,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+(ok?.22:.28));o.start();o.stop(c.currentTime+(ok?.23:.29));if(ok){setTimeout(()=>{try{let o2=c.createOscillator();o2.connect(g);o2.frequency.value=880;o2.start();o2.stop(c.currentTime+.18)}catch(e){}},100)}}catch(e){}}
function start(){score=0;round=0;timer=60;playing=true;document.getElementById('score').textContent=0;document.getElementById('time').textContent=60;document.getElementById('start').classList.add('hidden');document.getElementById('result').textContent='정답 +100점 · 오답 -20점';clearInterval(timerId);timerId=setInterval(()=>{timer--;document.getElementById('time').textContent=timer;if(timer<=0)finish()},1000);pickTarget();syncScore()}
function finish(){playing=false;clearInterval(timerId);document.getElementById('target').textContent='게임 종료!';document.getElementById('hint').textContent='최종 점수: '+score+'점';document.getElementById('result').textContent='🏁 최종 점수 '+score+'점';document.getElementById('start').classList.remove('hidden');document.getElementById('startBtn').textContent='다시 시작';syncScore();}
function reset(){playing=false;clearInterval(timerId);score=0;round=0;timer=60;document.getElementById('score').textContent=0;document.getElementById('round').textContent='0/10';document.getElementById('time').textContent=60;document.getElementById('start').classList.remove('hidden');document.getElementById('startBtn').textContent='게임 시작';clearMarks();}
function updateRank(){let arr=Object.entries(scores).sort((a,b)=>b[1]-a[1]);document.getElementById('ranking').classList.remove('hidden');document.getElementById('rankBody').innerHTML=arr.map(([n,s],i)=>`<tr><td>${i+1}</td><td>${n}</td><td style="text-align:right;font-weight:900">${s}</td></tr>`).join('')}
function syncScore(){if(!player)return;scores[player]=score;updateRank();if(isHost)connections.forEach(c=>{try{c.send({type:'score',name:player,score})}catch(e){}});else if(peer&&window.hostConn)try{window.hostConn.send({type:'score',name:player,score})}catch(e){}}
function hostRoom(){player=document.getElementById('nickname').value.trim()||'교사';isHost=true;peer=new Peer();peer.on('open',id=>{let code=id.slice(-6).toUpperCase();document.getElementById('roomCode').value=code;document.getElementById('connStatus').textContent='방 생성 완료! 학생에게 코드 '+code+' 를 알려주세요.';scores[player]=0;updateRank()});peer.on('connection',c=>{connections.push(c);c.on('data',d=>{if(d.type==='score'){scores[d.name]=d.score;updateRank();connections.forEach(x=>{if(x!==c)try{x.send(d)}catch(e){}})}});c.on('open',()=>c.send({type:'hello',scores}));})}
function joinRoom(){player=document.getElementById('nickname').value.trim()||'학생';let code=document.getElementById('roomCode').value.trim();if(!code){alert('방 코드를 입력하세요.');return}isHost=false;peer=new Peer();peer.on('open',()=>{let full=findHostId(code);window.hostConn=peer.connect(full);window.hostConn.on('open',()=>{document.getElementById('connStatus').textContent='방 참가 완료!';window.hostConn.send({type:'score',name:player,score:0})});window.hostConn.on('data',d=>{if(d.type==='hello'){scores=d.scores||{};updateRank()}if(d.type==='score'){scores[d.name]=d.score;updateRank()}})});}
function findHostId(code){return code}
// PeerJS IDs are not discoverable by suffix. Use full ID copied into room field if needed.
document.getElementById('hostBtn').onclick=hostRoom;document.getElementById('joinBtn').onclick=()=>{let v=document.getElementById('roomCode').value.trim();if(v.length<10){document.getElementById('connStatus').textContent='안내: 학생 참가에는 교사가 표시한 전체 방 ID를 입력하세요.';return}joinRoom()};
document.getElementById('startBtn').onclick=start;document.getElementById('restart').onclick=reset;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(playing)return;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;document.getElementById('qtype').textContent=mode==='province'?'지도에서 다음 성·자치구를 찾아 터치하세요':'지도에서 다음 도시를 찾아 터치하세요';render()});
async function loadMap(){let urls=['https://geojson.cn/api/china/100000.json','https://raw.githubusercontent.com/Supeset/China-GeoData/main/geojson/china_province_full.geojson'];for(let u of urls){try{let r=await fetch(u);if(!r.ok)continue;let j=await r.json();features=j.features||[];if(features.length){render();document.getElementById('hint').textContent='지도가 준비되었습니다. 게임 시작을 누르세요.';return}}catch(e){}}document.getElementById('hint').textContent='지도 데이터를 불러오지 못했습니다. 인터넷 연결을 확인하세요.'}
loadMap();
</script></body></html>
