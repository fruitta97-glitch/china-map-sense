<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>중국지도 SENSE</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;background:#f5f7fb;color:#172033;touch-action:manipulation}header{padding:12px 16px;background:#fff;border-bottom:1px solid #e5e8ef;display:flex;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}h1{font-size:20px;margin:0}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#eef2ff;border-radius:999px;padding:7px 10px;font-weight:700;font-size:13px}.wrap{max-width:1100px;margin:auto;padding:12px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.controls button{border:0;border-radius:12px;padding:10px 14px;background:#fff;box-shadow:0 1px 5px #0001;font-weight:700}.controls button.active{background:#172033;color:white}.question{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px #0001}.qsmall{font-size:13px;color:#657087}.target{font-size:25px;font-weight:900;margin-top:4px}.hint{font-size:13px;color:#68748a;margin-top:3px}.mapbox{background:#dfeaf2;border-radius:18px;overflow:hidden;box-shadow:0 2px 12px #0001;position:relative}.mapbox svg{display:block;width:100%;height:min(68vh,680px);background:#eaf3f7}.province{fill:#fff;stroke:#778899;stroke-width:.6;cursor:pointer;transition:.08s}.province:hover{fill:#dbeafe}.province.correct{fill:#86efac;stroke:#15803d;stroke-width:1.2}.province.wrong{fill:#fecaca;stroke:#dc2626;stroke-width:1.1}.citydot{fill:#1d4ed8;stroke:#fff;stroke-width:1.5;cursor:pointer}.citydot:hover{r:7}.citydot.correct{fill:#16a34a}.citydot.wrong{fill:#dc2626}.label{font-size:9px;fill:#344054;pointer-events:none;text-anchor:middle;font-weight:700}.toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 15px;border-radius:999px;font-weight:800;display:none;z-index:3}.toast.show{display:block}.start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0003;z-index:2}.start button{font-size:20px;padding:15px 24px;border:0;border-radius:16px;background:#fff;font-weight:900;box-shadow:0 5px 20px #0003}.result{padding:10px;text-align:center;font-weight:800}.note{font-size:12px;color:#697386;margin-top:8px;line-height:1.5}@media(max-width:600px){h1{font-size:17px}.target{font-size:22px}.mapbox svg{height:62vh}.pill{padding:6px 8px}}
</style></head>
<body>
<header><h1>🇨🇳 중국지도 SENSE</h1><div class="stats"><span class="pill">점수 <b id="score">0</b></span><span class="pill">문제 <b id="round">0/10</b></span><span class="pill">⏱ <b id="time">60</b>초</span></div></header>
<main class="wrap">
<div class="controls"><button class="active" data-mode="province">성·자치구 찾기</button><button data-mode="city">주요 도시 찾기</button><button id="speed">⚡ 60초 스피드</button><button id="restart">↻ 다시 시작</button></div>
<section class="question"><div class="qsmall" id="qtype">지도에서 다음 지역을 찾아 터치하세요</div><div class="target" id="target">시작 버튼을 눌러 주세요</div><div class="hint" id="hint">중국어 이름도 함께 익혀 보세요.</div></section>
<div class="mapbox"><div class="toast" id="toast"></div><div class="start" id="start"><button id="startBtn">게임 시작</button></div><svg id="map" viewBox="0 0 1000 700" aria-label="중국 지도"></svg></div>
<div class="result" id="result">성·자치구 10문제 · 정답 +100점 · 오답 -20점</div>
<div class="note">※ 이 버전은 서버 없이 작동하는 수업용 게임입니다. 학생 30명이 동시에 접속해도 서로 점수나 문제가 섞이지 않습니다. GitHub Pages 등에 올리면 태블릿에서 링크 하나로 접속할 수 있습니다.</div>
</main>
<script>
const provinceNames=[
['北京','北京市'],['天津','天津市'],['河北','河北省'],['山西','山西省'],['内蒙古','内蒙古自治区'],['辽宁','辽宁省'],['吉林','吉林省'],['黑龙江','黑龙江省'],['上海','上海市'],['江苏','江苏省'],['浙江','浙江省'],['安徽','安徽省'],['福建','福建省'],['江西','江西省'],['山东','山东省'],['河南','河南省'],['湖北','湖北省'],['湖南','湖南省'],['广东','广东省'],['广西','广西壮族自治区'],['海南','海南省'],['重庆','重庆市'],['四川','四川省'],['贵州','贵州省'],['云南','云南省'],['西藏','西藏自治区'],['陕西','陕西省'],['甘肃','甘肃省'],['青海','青海省'],['宁夏','宁夏回族自治区'],['新疆','新疆维吾尔自治区'],['台湾','台湾省'],['香港','香港特别行政区'],['澳门','澳门特别行政区']];
const cities=[
['北京','北京',39.9042,116.4074],['上海','上海',31.2304,121.4737],['西安','시안',34.3416,108.9398],['成都','청두',30.5728,104.0668],['重庆','충칭',29.5630,106.5516],['广州','광저우',23.1291,113.2644],['深圳','선전',22.5431,114.0579],['桂林','구이린',25.2742,110.2900],['昆明','쿤밍',25.0389,102.7183],['青岛','칭다오',36.0671,120.3826],['哈尔滨','하얼빈',45.8038,126.5349],['乌鲁木齐','우루무치',43.8256,87.6168],['拉萨','라싸',29.6520,91.1721],['丽江','리장',26.8721,100.2299],['厦门','샤먼',24.4798,118.0894],['大连','다롄',38.9140,121.6147],['南京','난징',32.0603,118.7969],['杭州','항저우',30.2741,120.1551],['武汉','우한',30.5928,114.3055],['长沙','창사',28.2282,112.9388],['郑州','정저우',34.7466,113.6254],['济南','지난',36.6512,117.1201],['沈阳','선양',41.8057,123.4315],['长春','창춘',43.8171,125.3235],['太原','타이위안',37.8706,112.5489],['兰州','란저우',36.0611,103.8343],['西宁','시닝',36.6171,101.7782],['银川','인촨',38.4872,106.2309],['呼和浩特','후허하오터',40.8426,111.7492],['南宁','난닝',22.8170,108.3665],['福州','푸저우',26.0745,119.2965],['南昌','난창',28.6820,115.8579],['贵阳','구이양',26.6470,106.6302],['海口','하이커우',20.0440,110.1983],['石家庄','스자좡',38.0428,114.5149]];
let mode='province',data=null,features=[],score=0,round=0,target=null,playing=false,timer=60,timerId=null;
const svg=document.getElementById('map'), NS='http://www.w3.org/2000/svg';
function proj(lon,lat){const x=(lon-73)/62*930+25;const y=(54-lat)/39*640+20;return [x,y]}
function pathFor(g){if(g.type==='Polygon') return polyPath(g.coordinates[0]); if(g.type==='MultiPolygon') return g.coordinates.map(p=>polyPath(p[0])).join(' '); return ''}
function polyPath(a){return a.map((p,i)=>{const [x,y]=proj(p[0],p[1]);return (i?'L':'M')+x.toFixed(1)+','+y.toFixed(1)}).join(' ')+'Z'}
function render(){svg.innerHTML=''; if(!data)return; features.forEach((f,i)=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',pathFor(f.geometry));p.classList.add('province');p.dataset.name=f.properties.name||f.properties.NAME||'';p.onclick=()=>clickProvince(p.dataset.name,p);svg.appendChild(p)}); if(mode==='city') cities.forEach(c=>{const [name,ko,lat,lon]=c,[x,y]=proj(lon,lat);const g=document.createElementNS(NS,'g');const d=document.createElementNS(NS,'circle');d.setAttribute('cx',x);d.setAttribute('cy',y);d.setAttribute('r',5);d.classList.add('citydot');d.dataset.city=name;d.onclick=()=>clickCity(name,d);g.appendChild(d);const t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',y-8);t.classList.add('label');t.textContent=name;g.appendChild(t);svg.appendChild(g)});}
function pickTarget(){if(round>=10){finish();return}round++;document.getElementById('round').textContent=round+'/10';if(mode==='province'){const f=features[Math.floor(Math.random()*features.length)];target=f.properties.name;document.getElementById('target').textContent=target+'을(를) 찾아보세요';document.getElementById('hint').textContent='중국어 이름을 보고 지도에서 해당 지역을 터치하세요.'}else{const c=cities[Math.floor(Math.random()*cities.length)];target=c[0];document.getElementById('target').textContent=target+'（'+c[1]+'）을(를) 찾아보세요';document.getElementById('hint').textContent='도시의 위치를 지도에서 터치하세요.'}}
function clearMarks(){svg.querySelectorAll('.correct,.wrong').forEach(e=>e.classList.remove('correct','wrong'))}
function answer(ok,el,answerName){if(!playing)return;el.classList.add(ok?'correct':'wrong');score+=ok?100:-20;document.getElementById('score').textContent=score;showToast(ok?'⭕ 정답! +100':'❌ 오답! -20');if(!ok)setTimeout(()=>{showToast('정답: '+target)},350);setTimeout(()=>{clearMarks();pickTarget()},650)}
function clickProvince(name,el){answer(name===target,el,name)}function clickCity(name,el){answer(name===target,el,name)}
function showToast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),700)}
function start(){score=0;round=0;timer=60;playing=true;document.getElementById('score').textContent=0;document.getElementById('time').textContent=60;document.getElementById('start').style.display='none';document.getElementById('result').textContent='정답 +100점 · 오답 -20점';clearInterval(timerId);timerId=setInterval(()=>{timer--;document.getElementById('time').textContent=timer;if(timer<=0)finish()},1000);pickTarget()}
function finish(){playing=false;clearInterval(timerId);document.getElementById('target').textContent='게임 종료!';document.getElementById('hint').textContent='최종 점수: '+score+'점';document.getElementById('result').textContent='수고했습니다! 다시 시작하려면 ↻ 다시 시작을 누르세요.';document.getElementById('start').style.display='flex';document.getElementById('startBtn').textContent='다시 시작'}
async function loadMap(){try{const urls=['https://geojson.cn/api/china/100000.json','https://raw.githubusercontent.com/Supeset/China-GeoData/main/geojson/china_province_full.geojson'];for(const u of urls){try{const r=await fetch(u);if(!r.ok)continue;const j=await r.json();features=j.features||[];data=j;render();return}catch(e){}}document.getElementById('hint').textContent='지도 데이터를 불러오지 못했습니다. 인터넷 연결을 확인하세요.'}catch(e){}}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(playing)return;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;document.getElementById('qtype').textContent=mode==='province'?'지도에서 다음 성·자치구를 찾아 터치하세요':'지도에서 다음 도시를 찾아 터치하세요';render();});
document.getElementById('startBtn').onclick=start;document.getElementById('restart').onclick=()=>{playing=false;clearInterval(timerId);document.getElementById('start').style.display='flex';document.getElementById('startBtn').textContent='게임 시작';score=0;round=0;document.getElementById('score').textContent=0;document.getElementById('round').textContent='0/10';document.getElementById('time').textContent='60';clearMarks();};document.getElementById('speed').onclick=()=>{mode='province';document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));document.querySelector('[data-mode="province"]').classList.add('active');start()};loadMap();
</script></body></html>
